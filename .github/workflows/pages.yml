name: Pages

# Publishes 16_l2book's pages at https://gburd.github.io/libxtc-examples/l2book/
#   index.html    the landing page (what l2book is, its numbers, how to run it)
#   console.html  the console: book.wasm (the engine the venue runs, compiled
#                 to wasm32) matching a simulated market in the page
#   style.css, app.js, console.js, book.wasm
# No venue is behind a static page, so the console's /symbols probe fails and
# it runs its simulated market (SIM) only.  The pages are the example's own
# web/ files, unchanged.

on:
  push:
    branches: [main]
    paths:
      - '16_l2book/book.c'
      - '16_l2book/book.h'
      - '16_l2book/wasm.c'
      - '16_l2book/console.[ch]'
      - '16_l2book/signals.[ch]'
      - '16_l2book/gorand.[ch]'
      - '16_l2book/check_wasm.mjs'
      - '16_l2book/web/**'
      - '16_l2book/Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build book.wasm (clang wasm32, no libc)
        working-directory: 16_l2book
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld
          make wasm WASM_CC=clang
          ls -l web/book.wasm
      - name: Check book.wasm against known answers
        working-directory: 16_l2book
        run: |
          # The engine's quickstart; the console market at seed 1, step 79,
          # against the values intrepidkarthi/orderbook's console shows for
          # the same seed (OFI, CVD, imbalance, Kyle's lambda, R^2, n);
          # 20,000 steps with book_check clean and the digest replayed; the
          # spoof and flood alerts; the LIVE signal path.  Fails the deploy
          # if book.wasm does not do what the native engine does.
          node check_wasm.mjs web/book.wasm
      - name: Assemble the site
        run: |
          mkdir -p _site/l2book
          cp 16_l2book/web/index.html 16_l2book/web/console.html \
             16_l2book/web/style.css 16_l2book/web/app.js \
             16_l2book/web/console.js 16_l2book/web/book.wasm _site/l2book/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>libxtc examples</title>
          <p><a href="l2book/">16_l2book</a>: a level-2 limit order book and
          matching venue on libxtc; <a href="l2book/console.html">its console</a>
          runs the engine in your browser (book.wasm).</p>
          <p>Source: <a href="https://github.com/gburd/libxtc-examples">libxtc-examples</a>.</p>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}l2book/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
