name: Pages

# Publishes 16_l2book's console, running its LOCAL mode (book.wasm: the
# engine the venue runs, compiled to wasm32, matching an in-page flow) at
#   https://gburd.github.io/libxtc-examples/l2book/
# No venue is behind a static page, so the console's /symbols probe fails and
# it starts in LOCAL mode by itself.  The page is the example's own
# web/index.html, unchanged.

on:
  push:
    branches: [main]
    paths:
      - '16_l2book/book.c'
      - '16_l2book/book.h'
      - '16_l2book/wasm.c'
      - '16_l2book/web/**'
      - '16_l2book/Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build book.wasm (clang wasm32, no libc)
        working-directory: 16_l2book
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld
          make wasm WASM_CC=clang
          ls -l web/book.wasm
      - name: Check the engine in wasm against a known replay
        working-directory: 16_l2book
        run: |
          # The quickstart: a resting sell, a crossing buy, then a book
          # with a bid and an ask.  Fails the deploy if book.wasm does not
          # match what the native engine does.
          cat > /tmp/check.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          const { instance } = await WebAssembly.instantiate(readFileSync('web/book.wasm'));
          const w = instance.exports;
          if (w.lob_init(10000n, 1 << 15) !== 0) throw new Error('lob_init');
          w.lob_submit(1n, 1, 1, 0, 0, 0, 10100n, 0n, 6n, 0n);
          w.lob_submit(2n, 2, 0, 0, 1, 0, 10100n, 0n, 5n, 0n);
          w.lob_submit(3n, 3, 0, 0, 0, 0, 9900n, 0n, 10n, 0n);
          if (w.lob_trades() !== 1n && w.lob_trades() !== 1) throw new Error('trades ' + w.lob_trades());
          if (Number(w.lob_best(0)) !== 9900 || Number(w.lob_best(1)) !== 10100) throw new Error('bbo');
          if (w.lob_check() !== 0) throw new Error('lob_check');
          console.log('book.wasm: 1 trade, bid 9900 ask 10100, check 0');
          EOF
          node /tmp/check.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site/l2book
          cp 16_l2book/web/index.html 16_l2book/web/book.wasm _site/l2book/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>libxtc examples</title>
          <p><a href="l2book/">16_l2book</a>: a level-2 limit order book; the
          console runs the engine in your browser (book.wasm).</p>
          <p>Source: <a href="https://github.com/gburd/libxtc-examples">libxtc-examples</a>.</p>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}l2book/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
